name: GPU C++ Backbone

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

env:
  PROJECT_CUDA_ARCHITECTURES: ${{ vars.PROJECT_CUDA_ARCHITECTURES || 'native' }}

jobs:
  toolcheck:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, vulkan, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Check developer tools
        run: REQUIRE_CUDA=0 REQUIRE_VULKAN=1 REQUIRE_PROFILING=0 scripts/check_dev_tools.sh

  build-dev:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, vulkan, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset dev -DPROJECT_CUDA_ARCHITECTURES="$PROJECT_CUDA_ARCHITECTURES"
      - name: Build
        run: cmake --build --preset dev

  quick-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, vulkan, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset dev -DPROJECT_CUDA_ARCHITECTURES="$PROJECT_CUDA_ARCHITECTURES"
      - run: cmake --build --preset dev
      - run: ctest --preset quick --output-on-failure

  gpu-smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, vulkan, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset dev -DPROJECT_CUDA_ARCHITECTURES="$PROJECT_CUDA_ARCHITECTURES"
      - run: cmake --build --preset dev
      - run: ctest --preset gpu --output-on-failure

  vulkan-shader:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, vulkan, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset vulkan-debug -DPROJECT_CUDA_ARCHITECTURES="$PROJECT_CUDA_ARCHITECTURES"
      - run: cmake --build --preset vulkan-debug
      - run: ctest --preset vulkan-shader --output-on-failure

  vulkan-runtime:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, vulkan, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset vulkan-debug -DPROJECT_CUDA_ARCHITECTURES="$PROJECT_CUDA_ARCHITECTURES"
      - run: cmake --build --preset vulkan-debug
      - run: ctest --preset vulkan --output-on-failure
      - name: Dump Vulkan capabilities on failure
        if: failure()
        run: scripts/dump_vulkan_capabilities.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vulkan-runtime-capabilities
          path: artifacts/vulkan
          if-no-files-found: ignore

  vulkan-validation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, linux, vulkan, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset vulkan-validation -DPROJECT_CUDA_ARCHITECTURES="$PROJECT_CUDA_ARCHITECTURES"
      - run: cmake --build --preset vulkan-validation
      - run: scripts/run_vulkan_validation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-validation-logs
          path: artifacts/vulkan
          if-no-files-found: ignore

  compute-sanitizer:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, linux, cuda, vulkan, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset cuda-debug -DPROJECT_CUDA_ARCHITECTURES="$PROJECT_CUDA_ARCHITECTURES"
      - run: cmake --build --preset cuda-debug
      - run: scripts/run_compute_sanitizer.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compute-sanitizer-logs
          path: artifacts/sanitizer
          if-no-files-found: ignore

  profile-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, linux, vulkan, gpu, profile]
    steps:
      - uses: actions/checkout@v4
      - name: Check profiling tools
        run: REQUIRE_CUDA=0 REQUIRE_VULKAN=1 REQUIRE_PROFILING=1 REQUIRE_CUDA_PROFILING=0 scripts/check_dev_tools.sh
      - run: cmake --preset profile -DPROJECT_CUDA_ARCHITECTURES="$PROJECT_CUDA_ARCHITECTURES"
      - run: cmake --build --preset profile
      - run: BUILD_DIR=build/profile scripts/run_nsys_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsys-smoke
          path: artifacts/profiling
          if-no-files-found: ignore
