name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Repo Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install validation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            glslc \
            libvulkan-dev \
            mesa-vulkan-drivers \
            ninja-build \
            rsync \
            shellcheck \
            spirv-tools \
            vulkan-tools \
            vulkan-validationlayers
          curl -fsSL -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-6 cuda-cudart-dev-12-6
          echo "/usr/local/cuda-12.6/bin" >> "${GITHUB_PATH}"
          echo "CUDAToolkit_ROOT=/usr/local/cuda-12.6" >> "${GITHUB_ENV}"

      - name: Configure Vulkan CPU ICD
        run: |
          for icd in \
            /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            /usr/share/vulkan/icd.d/lvp_icd.json
          do
            if [[ -f "${icd}" ]]; then
              echo "Using Vulkan CPU ICD: ${icd}"
              echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
              echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
              export VK_DRIVER_FILES="${icd}"
              export VK_ICD_FILENAMES="${icd}"
              vulkaninfo --summary
              exit 0
            fi
          done
          find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print >&2
          echo "No Lavapipe Vulkan CPU ICD found" >&2
          exit 1

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n skills/cpp-cuda-vulkan-studio/scripts/*.sh

      - name: Run ShellCheck
        run: |
          shellcheck scripts/*.sh
          shellcheck skills/cpp-cuda-vulkan-studio/scripts/*.sh

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/*.py skills/cpp-cuda-vulkan-studio/scripts/*.py

      - name: Validate donor library and trigger matrix
        run: |
          python3 scripts/validate_donor_library.py \
            skills/cpp-cuda-vulkan-studio/references/donor-library \
            --reference-root skills/cpp-cuda-vulkan-studio/references
          python3 scripts/validate_trigger_matrix.py \
            research/donor-library/trigger-matrix.json \
            --repo-root .

      - name: Run CppStudio validation
        env:
          VALIDATOR: ${{ github.workspace }}/scripts/quick_validate_skill.py
          CPPSTUDIO_FULL_CUDA_ARCHITECTURES: "75"
          CPPSTUDIO_SKIP_CUDA_RUNTIME_TESTS: "1"
        run: ./scripts/validate.sh --full
